blocklist:
  forbidden_columns:
  - kolektibilitas_akhir
  - dpd_max_post
  - status_writeoff
  suspicious_name_patterns:
  - default
  - kolek
  - dpd
  - npl
  - write_off
  - restruct
  - recovery
data:
  entity_col: customer_id
  index_col: application_id
  pii_columns:
  - nik
  - npwp
  - nama
  - no_rekening
  target: default_flag
  test: data/leaky_test.parquet
  time_col: application_date
  train: data/leaky_train.parquet
detectors:
  allow_missing: false
  enabled:
  - builtin
  - deepchecks
  - ppscore
  - cleanlab
environments:
  builtin: null
  cleanlab: /root/data-leakage/leakage-guard/.envs/cl/bin/python
  deepchecks: /root/data-leakage/leakage-guard/.envs/dc/bin/python
  ppscore: /root/data-leakage/leakage-guard/.envs/dc/bin/python
gate:
  fail_on:
  - CRITICAL
  waivers_file: null
model_id: abc-scoring-pd-v3
prediction:
  embargo_days: 30
  maturity_window_days: 365
  prediction_date_col: application_date
privacy:
  min_group_size: 5
  quasi_identifier_columns:
  - kode_pos
report:
  language: id
  require_owner_assessment: true
runtime:
  max_rows: 100000
  seed: 42
thresholds:
  adversarial:
    crit: 0.95
    warn: 0.7
  identifier_label:
    crit: 0.2
    warn: 0.1
  pps:
    crit: 0.8
    warn: 0.5
  row_overlap:
    crit_pct: 1.0
    warn_pct: 0.0
  single_feature:
    crit: 0.95
    warn: 0.85
  temporal:
    crit_pct: 5.0
    warn_pct: 0.0
version: 1
