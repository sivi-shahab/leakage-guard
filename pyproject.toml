[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "leakage-guard"
version = "0.1.0"
description = "A quality gate that detects, explains and blocks data leakage in tabular ML pipelines."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sivi Almanaf A.S", email = "sivi.shahab@gmail.com" }]
keywords = ["data-leakage", "machine-learning", "mlops", "data-quality", "credit-scoring", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "pyarrow>=15",
]

[project.optional-dependencies]
# Pin sesuai docs/SPEC.md 3.3 (diuji). Jangan dilonggarkan tanpa uji ulang.
deepchecks = [
    "deepchecks==0.19.1",
    "scikit-learn<1.6",
    "numpy<2",
    "pandas<2.3",
    "setuptools<81",
    "pyarrow<=19.0.1",
    "anywidget",  # plotly>=6 needs it for deepchecks HTML reports
]
ppscore = ["ppscore==1.3.1"]
cleanlab = ["cleanlab[datalab]>=2.9,<3"]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy", "pandas-stubs", "types-PyYAML"]

[project.urls]
Homepage = "https://github.com/sivi-shahab/leakage-guard"
Documentation = "https://sivi-shahab.github.io/leakage-guard/"
Issues = "https://github.com/sivi-shahab/leakage-guard/issues"

[project.scripts]
leakage-guard = "leakage_guard.cli:main"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "rules", "examples", "docs", "LICENSE", "README.md", "pyproject.toml"]
exclude = ["docs/_build", "examples/data"]

[tool.hatch.build.targets.wheel]
packages = ["src/leakage_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "deepchecks: butuh environment Deepchecks",
    "ppscore: butuh environment ppscore",
    "cleanlab: butuh environment Cleanlab",
    "compat: tes kompatibilitas pin terjadwal (butuh jaringan), bukan CI default",
]
addopts = "-m 'not compat'"

[tool.coverage.run]
source = ["leakage_guard"]
omit = ["*/runners/*", "*/deepchecks_detector.py", "*/ppscore_detector.py", "*/cleanlab_detector.py"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501", "S603", "S607"]
"src/leakage_guard/reasons/catalog.py" = ["E501"]
"examples/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "deepchecks.*", "ppscore", "cleanlab", "cleanlab.*"]
ignore_missing_imports = true
