[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leakage-guard"
version = "0.1.0"
description = "Quality gate untuk mendeteksi dan menjelaskan data leakage di pipeline ML tabular."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "TODO(owner): pilih lisensi" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "pyarrow>=15",
]

[project.optional-dependencies]
# Pin sesuai docs/SPEC.md 3.3 (diuji). Jangan dilonggarkan tanpa uji ulang.
deepchecks = [
    "deepchecks==0.19.1",
    "scikit-learn<1.6",
    "numpy<2",
    "pandas<2.3",
    "setuptools<81",
    "pyarrow<=19.0.1",
    "anywidget",  # plotly>=6 needs it for deepchecks HTML reports
]
ppscore = ["ppscore==1.3.1"]
cleanlab = ["cleanlab[datalab]>=2.9,<3"]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy", "pandas-stubs", "types-PyYAML"]

[project.scripts]
leakage-guard = "leakage_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leakage_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "deepchecks: butuh environment Deepchecks",
    "ppscore: butuh environment ppscore",
    "cleanlab: butuh environment Cleanlab",
    "compat: tes kompatibilitas pin terjadwal (butuh jaringan), bukan CI default",
]
addopts = "-m 'not compat'"

[tool.coverage.run]
source = ["leakage_guard"]
omit = ["*/runners/*", "*/deepchecks_detector.py", "*/ppscore_detector.py", "*/cleanlab_detector.py"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501", "S603", "S607"]
"src/leakage_guard/reasons/catalog.py" = ["E501"]
"examples/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "deepchecks.*", "ppscore", "cleanlab", "cleanlab.*"]
ignore_missing_imports = true
