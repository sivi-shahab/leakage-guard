# Publishes to PyPI when a tag v* is pushed. Uses PyPI Trusted Publishing (OIDC): no API token stored.
# One-time setup on pypi.org: Publishing -> add a trusted publisher
#   owner=sivi-shahab, repo=leakage-guard, workflow=release.yml, environment=pypi
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: { name: pypi, url: "https://pypi.org/p/leakage-guard" }
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
