# NOTE: GitHub only reads workflows at the repository root. If leakage-guard lives in a monorepo
# subfolder, move this file to <root>/.github/workflows/ (the working-directory below stays).
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: docs
on:
  push:
    branches: [main]
    paths: ["leakage-guard/docs/**", "leakage-guard/src/**", "leakage-guard/pyproject.toml"]
  pull_request:
    paths: ["leakage-guard/docs/**", "leakage-guard/src/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
defaults:
  run:
    working-directory: leakage-guard
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 .envs/docs && uv pip install --python .envs/docs/bin/python -r locks/docs.in -e .
      - run: .envs/docs/bin/sphinx-build -b html -W --keep-going docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with: { path: leakage-guard/docs/_build/html }
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
